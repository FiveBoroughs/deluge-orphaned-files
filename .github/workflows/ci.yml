name: CI & Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies & dev tools
        run: |
          python -m pip install --upgrade pip
          # Black is pinned below 26: the 26.0 stable style collapses `f("""…""")` call
          # wrapping, which reformats six files this repo formatted under 25.x.
          pip install -r requirements.txt "black<26" flake8 pytest

      - name: Black format check (line length 200)
        run: black --check --line-length 200 .

      - name: Flake8 linting (line length 200)
        run: flake8 --max-line-length 200 .

      - name: Run unit tests
        run: pytest -q

  docker:
    name: Build & smoke-test Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build OCI image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=min
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}

      - name: Smoke-test the container entrypoint
        run: |
          skopeo copy --dest-daemon-host "${DOCKER_HOST:-unix:///var/run/docker.sock}" "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:deluge-orphaned-files:ci
          docker run --rm --network none deluge-orphaned-files:ci --help
          code=0
          docker run --rm --network none -e CRON_SCHEDULE=invalid deluge-orphaned-files:ci --help || code=$?
          test "$code" -eq 2

      - name: Save the tested OCI image for publishing
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Publish tested Docker image
    needs: [lint-test, docker]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}

      - name: Push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/image.tar" "docker://$image:$GITHUB_SHA"
          skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/image.tar" "docker://$image:latest"
